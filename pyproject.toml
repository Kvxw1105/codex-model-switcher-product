[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-model-switcher"
version = "0.1.0"
description = "Local routing and control center for Codex model lanes"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "cryptography>=42,<45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-timeout>=2,<3",
    "ruff>=0.5,<1",
    "pip-audit>=2.7,<3",
    "detect-secrets>=1.5,<2",
    "pyinstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
